plugins {
    id 'com.android.application'
}
android {
    namespace 'it.ampy.ampypad'
    compileSdk 36
    defaultConfig {
        applicationId 'it.ampy.ampypad'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }
    // Stable signing only through GitHub Actions secrets. Never commit a keystore.
    if (System.getenv('AMPYPAD_KEYSTORE_PATH') != null) {
        signingConfigs {
            ampyRelease {
                storeFile file(System.getenv('AMPYPAD_KEYSTORE_PATH'))
                storePassword System.getenv('AMPYPAD_STORE_PASSWORD')
                keyAlias System.getenv('AMPYPAD_KEY_ALIAS')
                keyPassword System.getenv('AMPYPAD_KEY_PASSWORD')
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.ampyRelease }
            release {
                signingConfig signingConfigs.ampyRelease
                minifyEnabled false
                shrinkResources false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
