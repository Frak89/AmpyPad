name: Smoke test AmpyPad (emulator)
on:
  workflow_dispatch:
  push:
    branches: [ "ampypad-*" ]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug && mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk out/AmpyPad.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash .github/smoke/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-shots, path: shots }
