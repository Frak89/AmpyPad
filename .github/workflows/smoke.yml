name: Smoke test AmpyPad (emulator)
# Manual: Actions → "Smoke test AmpyPad (emulator)" → Run workflow. Screenshots land on branch smoke-results.
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug && mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk out/AmpyPad.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash .github/smoke/run.sh
      - name: Publish shots to branch smoke-results
        if: always()
        run: |
          cd shots
          git init -q && git checkout -q -b smoke-results
          git add -A && git -c user.name=ci -c user.email=ci@local commit -q -m "shots ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke-results
